    <script>
        const form = document.getElementById('myForm');

        form.addEventListener('submit', function(event) {
            const formData = new FormData(form);
            let isValid = true;

            if (formData.get("name").trim() === "") {
                alert("Add your name please :)");
                isValid = false;
            } else if (formData.get("email").trim() === "") {
                alert("Forgot the email address :(");
                isValid = false;
            } else if (formData.get("message").trim() === "") {
                alert("Add your message please :)");
                isValid = false;
            }

            if (!isValid) {
                event.preventDefault(); // Only stop submission if invalid
            }
        });
